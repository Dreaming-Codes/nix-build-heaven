[package]
name = "nbh-gate"
version = "0.2.0"
edition = "2024"
description = "Launches an EC2 Spot Nix builder on demand, holds the ssh-ng connection while it boots, and terminates it when idle"

[dependencies]
base64ct = { version = "1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
humantime = "2"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh-key = { version = "0.6", features = ["ed25519", "getrandom", "std"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
ureq = "3"

[profile.dev]
debug = false
